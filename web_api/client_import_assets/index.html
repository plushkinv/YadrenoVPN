<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Добавить подписку</title>
  <link rel="stylesheet" href="/open-client/style.css">
  <script src="/open-client/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Добавить подписку</h1>
    <p id="status" role="status">Подготавливаем ссылку…</p>
    <div id="actions" hidden>
      <a id="open">Открыть приложение</a>
      <p>Если приложение не открылось автоматически, нажмите кнопку. Браузер может запросить разрешение на открытие.</p>
      <p>Приложение должно быть установлено. Подписку также можно добавить вручную:</p>
      <label for="subscription">Ссылка подписки</label>
      <input id="subscription" type="text" readonly spellcheck="false" autocomplete="off">
      <button id="copy" type="button">Скопировать ссылку</button>
      <p id="copy-status" role="status"></p>
    </div>
    <button id="retry" type="button" hidden>Повторить</button>
    <noscript>Для открытия приложения включите JavaScript в браузере.</noscript>
  </main>
</body>
</html>
